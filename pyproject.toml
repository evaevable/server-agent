[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "server-agent"
version = "0.1.0"
description = "A learn-by-building server troubleshooting agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "asyncssh>=2.14",
]

[project.optional-dependencies]
# httpx2：Starlette 1.7 起 TestClient 优先用 httpx2（仍用 httpx 会报 DeprecationWarning）。
# 只用于测试客户端；业务代码的 LLM / AGS 调用仍直接用 httpx（ADR-0001）。
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx2>=2.0"]

[project.scripts]
server-agent = "server_agent.cli:main"

[tool.setuptools.packages.find]
include = ["server_agent*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
