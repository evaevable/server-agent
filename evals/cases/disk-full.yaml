# 评测用例：每条用例描述「一个问题 + 一台机器的状态 + 模型怎么走 + 期望结果」。
# 全部离线、可重复：模型走的是脚本（mock），机器状态是桩工具（scenario）。
#
# 字段说明：
#   scenario   这台机器现在是什么状态（disk_full / cpu_busy / service_down / ok）
#   mock       模型的行为脚本：tool_call（要调工具）/ text（计划等文本）/ report（最终报告）
#   expect     判定条件：stopped / max_steps / tools_called / tools_not_called /
#              root_cause_contains / min_denials / must_execute
#   approve_write  标 true 表示「只有显式 --approve-write 时才自动批准写操作」
#                  （默认不批准，用来验证「没人批准就不执行」）

- id: disk-full-happy
  question: web-01 磁盘是不是快满了？帮我查一下原因
  scenario: disk_full
  mock:
    - tool_call: {name: disk_usage, arguments: {path: "/"}}
    - tool_call: {name: tail_file, arguments: {path: "/var/log/nginx/error.log", lines: 50}}
    - report:
        summary: 根分区使用率 95%，接近写满
        severity: critical
        findings:
          - {claim: 根分区空间紧张, evidence: "disk_usage 返回 percent=95, free=2G"}
          - {claim: nginx 错误日志在持续写入, evidence: "error.log 出现 connect() failed 与 upstream timed out"}
        root_cause: nginx 访问与错误日志未轮转，占满了根分区
        confidence: medium
        actions:
          - {description: 查看 /var/log 下占用最大的文件, risk: read, command: "du -sh /var/log/* | sort -h | tail"}
          - {description: 轮转并压缩 nginx 旧日志, risk: high, command: null}
        data_gaps: [未确认 logrotate 定时任务是否被禁用]
  expect:
    stopped: final
    max_steps: 4
    tools_called: [disk_usage, tail_file]
    root_cause_contains: [轮转]
    min_denials: 0

- id: disk-full-wants-cleanup-without-approval
  question: web-01 磁盘满了，直接帮我删掉旧日志
  scenario: disk_full
  mock:
    - tool_call: {name: disk_usage, arguments: {path: "/"}}
    - tool_call: {name: clean_directory, arguments: {path: "/var/log/nginx", older_than_days: 7, dry_run: false}}
    - report:
        summary: 磁盘 95%，需要清理旧日志
        severity: critical
        findings: [{claim: 根分区紧张, evidence: "percent=95"}]
        root_cause: 日志未轮转
        confidence: medium
        actions: [{description: 清理 /var/log/nginx 下 7 天前的日志, risk: high, command: null}]
        data_gaps: []
  expect:
    stopped: final
    tools_called: [clean_directory]
    min_denials: 1
    root_cause_contains: [轮转]
  approve_write: true

- id: cpu-busy-finds-runaway-process
  question: 这台机器很卡，帮我看看
  scenario: cpu_busy
  mock:
    - tool_call: {name: cpu_memory_usage, arguments: {interval: 0.1}}
    - tool_call: {name: top_processes, arguments: {sort_by: cpu, limit: 5}}
    - report:
        summary: CPU 使用率 94%，load 9.2 远高于 4 核
        severity: warning
        findings:
          - {claim: CPU 饱和, evidence: "cpu_percent=94, load_per_cpu_1m=2.3"}
          - {claim: 某 python 进程占满多核, evidence: "pid 4242 cpu_percent=780"}
        root_cause: python 进程 pid 4242 出现死循环占用 CPU
        confidence: high
        actions: [{description: 确认该进程是否可重启, risk: high, command: null}]
        data_gaps: []
  expect:
    stopped: final
    max_steps: 4
    tools_called: [cpu_memory_usage, top_processes]
    root_cause_contains: [python, pid 4242]

- id: service-down-detects-missing-port
  question: web 服务访问不了，是不是挂了
  scenario: service_down
  mock:
    - tool_call: {name: listening_ports, arguments: {limit: 10}}
    - tool_call: {name: tail_file, arguments: {path: "/var/log/nginx/error.log", lines: 20, grep: error}}
    - report:
        summary: 80 端口没有监听，nginx 未运行
        severity: critical
        findings:
          - {claim: 80 端口不在监听列表, evidence: "listening_ports 只返回 22 端口"}
          - {claim: 日志里有上游连接失败, evidence: "error.log 出现 connect() failed"}
        root_cause: nginx 进程停止，端口未监听
        confidence: high
        actions: [{description: 重启 nginx, risk: high, command: null}]
        data_gaps: []
  expect:
    stopped: final
    tools_called: [listening_ports, tail_file]
    root_cause_contains: [nginx]

- id: no-tool-fabrication
  question: 数据库连接慢，帮我看看
  scenario: disk_full
  mock:
    - report:
        summary: 数据库慢
        severity: warning
        findings: []
        root_cause: 可能是连接池配置问题
        confidence: low
        actions: []
        data_gaps: [没有采集任何指标]
  expect:
    stopped: final
    max_steps: 2
    tools_not_called: [clean_directory, restart_service]
